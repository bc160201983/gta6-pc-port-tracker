<!doctype html>
<html lang="en" data-eg="gta">
<head>
<script>window.STATIC_DATA="data.json";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Race — Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Stream scene — Leonida sunset / GTA-HUD style. Fixed 1920x1080 stage, scaled to fit.
   OBS: Browser Source -> http://localhost:8787/stream.html, width 1920, height 1080. */
:root{
  --bg:#0a0512; --ink:#fff7f0; --muted:#bfaecf; --dim:#6f6184; --line:rgba(255,255,255,.09);
  --panel:rgba(17,8,30,.74);
  --a:#ff3d8b; --b:#2fd4f0; --c:#ffb21e; --d:#a678ff; --e:#5b8cff; --f:#7be07b; --g:#ff6a3d; --h:#cfd6e6; --i:#ff9de2;
  --gold:#ffd23f; --money:#7be07b; --red:#ff2d55;
  --open:#3ddc84; --merged:#a678ff; --closed:#ff5c69; --draft:#8a85a0;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --tc:var(--gold);
}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;cursor:none}
body{color:var(--ink);font:20px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.a{--tc:var(--a)} .b{--tc:var(--b)} .c{--tc:var(--c)} .d{--tc:var(--d)} .e{--tc:var(--e)} .f{--tc:var(--f)} .g{--tc:var(--g)} .h{--tc:var(--h)} .i{--tc:var(--i)}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:var(--bg)}

/* ---------- Leonida sunset backdrop ---------- */
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#09031a 0%,#1a0833 26%,#3f0f4f 50%,#8d1a5c 68%,#e2464a 84%,#ffa046 100%)}
.stars{position:absolute;inset:0 0 50% 0;background-image:radial-gradient(1.5px 1.5px at 8% 12%,#fff8,transparent),radial-gradient(1px 1px at 23% 30%,#fff6,transparent),radial-gradient(1.5px 1.5px at 41% 8%,#fff7,transparent),radial-gradient(1px 1px at 57% 22%,#fff5,transparent),radial-gradient(1.5px 1.5px at 72% 6%,#fff8,transparent),radial-gradient(1px 1px at 86% 26%,#fff6,transparent),radial-gradient(1px 1px at 94% 11%,#fff7,transparent),radial-gradient(1px 1px at 33% 18%,#fff5,transparent);animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.45}}
.sunglow{position:absolute;left:50%;bottom:-420px;width:1700px;height:1100px;margin-left:-850px;background:radial-gradient(ellipse at center,rgba(255,120,80,.55),rgba(255,60,120,.18) 45%,transparent 70%)}
.sun{position:absolute;left:50%;bottom:-330px;width:820px;height:820px;margin-left:-410px;border-radius:50%;
  background:linear-gradient(180deg,#ffe86b 0%,#ffb03a 38%,#ff5a6e 68%,#c4157c 100%);
  -webkit-mask-image:linear-gradient(#000 0 47%,transparent 47%),repeating-linear-gradient(180deg,#000 0 20px,transparent 20px 32px);
  mask-image:linear-gradient(#000 0 47%,transparent 47%),repeating-linear-gradient(180deg,#000 0 20px,transparent 20px 32px);
  animation:sunpulse 9s ease-in-out infinite alternate;opacity:.9}
@keyframes sunpulse{to{transform:translateY(-14px)}}
.sea{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(40,6,40,.0),rgba(20,4,30,.85));}
.sea::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,170,90,.22) 0 2px,transparent 2px 12px);-webkit-mask-image:radial-gradient(ellipse 30% 100% at 50% 0,#000,transparent);mask-image:radial-gradient(ellipse 30% 100% at 50% 0,#000,transparent);animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:0 12px}}
.palms{position:absolute;inset:0;pointer-events:none}
.palms svg{position:absolute;bottom:-20px;fill:#0b0414}
.palms .p1{left:-70px;height:820px;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
.palms .p2{left:150px;height:600px;opacity:.85;transform-origin:50% 100%;animation:sway 9s ease-in-out infinite alternate-reverse}
.palms .p3{right:-90px;height:860px;transform:scaleX(-1);transform-origin:50% 100%;animation:swayr 8s ease-in-out infinite alternate}
.palms .p4{right:170px;height:560px;opacity:.8;transform:scaleX(-1);transform-origin:50% 100%;animation:swayr 10s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.4deg)}}
@keyframes swayr{from{transform:scaleX(-1) rotate(-1.2deg)}to{transform:scaleX(-1) rotate(1.4deg)}}
.scan{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(180deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);opacity:.5}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(5,0,12,.6))}

/* ---------- panels ---------- */
.panel{position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 22px 50px -26px #000,inset 0 1px 0 rgba(255,255,255,.07)}
.panel::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--pc,var(--a)),transparent);opacity:.9}
.lbl{display:flex;align-items:center;gap:12px;font:400 21px/1 Anton,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.lbl::before{content:"";width:6px;height:20px;border-radius:2px;background:var(--pc,var(--gold));box-shadow:0 0 12px var(--pc,var(--gold))}
.lbl small{font:600 13px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--muted)}

.main{position:absolute;left:40px;right:40px;top:26px;bottom:70px;display:grid;grid-template-rows:92px 462px 1fr;gap:16px;z-index:2}
.board{display:grid;grid-template-columns:600px 1fr;gap:16px;min-height:0}
.lcol{display:grid;grid-template-rows:296px 1fr;gap:16px;min-height:0}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:24px}
.logo{font:400 86px/.9 Anton,sans-serif;letter-spacing:.01em;display:flex;gap:14px;filter:drop-shadow(0 5px 0 #2a0b2f) drop-shadow(0 0 30px rgba(255,80,120,.45))}
.logo span{background:linear-gradient(180deg,#ffe979 0%,#ffb03a 40%,#ff4f8b 75%,#b52bd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .vi{background:linear-gradient(180deg,#9df3ff 0%,#4cc3ff 45%,#ff4f8b 100%);-webkit-background-clip:text;background-clip:text}
.bt{border-left:2px solid rgba(255,255,255,.18);padding-left:22px}
.bt .t1{font:400 46px/1 Anton,sans-serif;letter-spacing:.03em;font-style:italic;text-shadow:0 3px 0 #2a0b2f}
.bt .t2{font:600 15px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--muted);margin-top:8px;text-transform:uppercase}
.right{display:flex;gap:14px;align-items:center}
.pill{display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:99px;font:700 18px "JetBrains Mono",monospace;letter-spacing:.1em}
.onair{background:rgba(255,45,85,.16);border:1px solid rgba(255,45,85,.55);color:#ff6b86}
.onair .dot{width:12px;height:12px;border-radius:50%;background:var(--red);position:relative}
.onair .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--red);animation:ping 1.6s var(--ease) infinite}
.onair.off{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--muted)} .onair.off .dot{background:var(--dim)} .onair.off .dot::after{display:none}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.clockp{font:400 40px/1 Anton,sans-serif;letter-spacing:.04em;color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(255,255,255,.25);padding:0 4px}

/* ---------- crew cards ---------- */
.crews{display:grid;min-height:0}
.crew{--pc:var(--tc);padding:18px 22px 16px;display:grid;grid-template-columns:196px 1fr;grid-template-rows:1fr auto;column-gap:20px;row-gap:12px;overflow:hidden;transition:box-shadow .8s,transform .8s var(--ease)}
.crew .cglow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--tc),transparent 62%);opacity:.16;top:-260px;left:-200px;pointer-events:none}
.crew.ping{box-shadow:0 0 0 2px var(--tc),0 0 90px -10px var(--tc);transform:translateY(-4px)}
.cl{display:flex;flex-direction:column;gap:6px;position:relative}
.rk{display:flex;align-items:baseline;gap:10px}
.rk b{font:400 34px/1 Anton,sans-serif;color:var(--tc);text-shadow:0 0 18px color-mix(in srgb,var(--tc) 60%,transparent)}
.rk span{font:700 13px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--muted)}
.rk.first span{color:var(--gold)}
.big{font:400 80px/1 Anton,sans-serif;letter-spacing:-.01em;color:#fff;text-shadow:0 4px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 34px color-mix(in srgb,var(--tc) 50%,transparent)}
.big small{font-size:36px;margin-left:2px;color:var(--tc)}
.wanted{display:flex;gap:3px;font-size:24px;line-height:1}
.wanted i{font-style:normal;color:rgba(255,255,255,.16);text-shadow:none}
.wanted i.on{color:#fff;text-shadow:0 0 0 #000,1px 1px 0 #000,-1px 1px 0 #000,0 0 14px rgba(255,255,255,.6)}
.mo{align-self:flex-start;font:700 14px "JetBrains Mono",monospace;letter-spacing:.04em;padding:4px 10px;border-radius:8px;color:var(--money);background:rgba(123,224,123,.12);border:1px solid rgba(123,224,123,.35);white-space:nowrap}
.mo.flat{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}
.mo.dn{color:#ff8a8a;background:rgba(255,90,90,.1);border-color:rgba(255,90,90,.35)}
.cr{min-width:0;display:flex;flex-direction:column;gap:7px;position:relative}
.nm{display:flex;align-items:center;gap:12px}
.nm .n{font:400 34px/1.05 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;font:700 11px "JetBrains Mono",monospace;letter-spacing:.1em;padding:3px 9px;border-radius:99px;color:var(--muted);background:rgba(255,255,255,.05);white-space:nowrap}
.act.on{color:var(--open);background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.4)}
.act.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--open);box-shadow:0 0 0 0 var(--open);animation:act 1.6s infinite}
@keyframes act{0%{box-shadow:0 0 0 0 rgba(61,220,132,.7)}100%{box-shadow:0 0 0 9px rgba(61,220,132,0)}}
.tg{display:flex;align-items:center;gap:10px;font:600 13px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.06em;margin-top:-4px;white-space:nowrap}
.tg>span:first-child{overflow:hidden;text-overflow:ellipsis}
.now{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;margin-top:2px}
.now .k{font:700 11px "JetBrains Mono",monospace;letter-spacing:.16em;color:#0b0614;background:var(--tc);padding:3px 7px;border-radius:5px}
.now b{font:400 21px/1 Anton,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.now i{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.now i u{display:block;height:100%;width:0;background:var(--tc);border-radius:9px;transition:width 1.6s var(--ease);box-shadow:0 0 12px var(--tc)}
.now em{font:700 15px "JetBrains Mono",monospace;font-style:normal;color:var(--tc)}
.hl{font-size:17px;line-height:1.35;color:var(--ink);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:46px}
.ks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font:700 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ks span{display:flex;flex-direction:column;gap:3px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.ks b{font:400 22px/1 Anton,sans-serif;color:#fff;letter-spacing:.02em}
.cb{grid-column:1/-1;display:grid;gap:9px;position:relative}
.seg{display:flex;gap:4px;height:12px}
.seg span{position:relative;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.seg span i{position:absolute;inset:0 auto 0 0;width:0;background:var(--tc);transition:width 1.4s var(--ease);transition-delay:var(--d,0s)}
.seg span.done i{box-shadow:0 0 10px var(--tc)}
.spark{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:10px}
.spark .k,.spark .k2{font:700 11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:28px}
.bars i{flex:1;min-height:2px;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--tc) 85%,transparent);transition:height 1.2s var(--ease);opacity:.9}
.bars i.z{background:rgba(255,255,255,.1)}
.bars i:last-child{box-shadow:0 0 10px var(--tc)}

/* ---------- the race board: every crew on one scale ---------- */
.race{--pc:var(--gold);padding:10px 22px 10px;display:grid;grid-template-rows:40px 1fr;gap:4px;min-width:0;min-height:0}
.rh,.ln{display:grid;grid-template-columns:40px 178px 1fr 84px 132px;column-gap:12px;align-items:center}
.rh .lbl{grid-column:1/3;font-size:20px}
.rh .hk{font:700 10px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;align-self:end;padding-bottom:3px}
.rh .hk.r{text-align:right}
.cpk{position:relative;height:100%}
.cpk span{position:absolute;transform:translateX(-50%);font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.cpk span.up{top:4px} .cpk span.dn{bottom:3px}
.cpk span.hit{color:var(--gold)} .cpk span.pw{color:var(--money)} .cpk span.end{transform:translateX(-100%)}
.rows{position:relative;min-height:0}
.cpov{position:absolute;top:0;bottom:0;left:calc(40px + 178px + 24px);right:calc(84px + 132px + 24px);pointer-events:none}
.cpov i{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(255,210,63,.2)}
.cpov i.pl{border-left:2px solid rgba(123,224,123,.5)}
.cpov .well{position:absolute;top:0;bottom:0;right:0;background:linear-gradient(90deg,rgba(123,224,123,.08),rgba(123,224,123,.02))}
.ln{position:absolute;left:0;right:0;height:calc(100% / var(--n,9));top:calc(var(--i,0) * 100% / var(--n,9));border-top:1px solid var(--line);transition:top 1.2s var(--ease)}
.ln.me{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 18%,transparent),transparent 75%);box-shadow:inset 4px 0 0 var(--tc);border-radius:6px}
.ln.ping{animation:lnping 2.8s var(--ease)}
@keyframes lnping{0%,35%{background:color-mix(in srgb,var(--tc) 32%,transparent)}100%{background:transparent}}
.ln .rk2{font:400 24px/1 Anton,sans-serif;color:var(--tc);text-align:center}
.ln.lead .rk2{color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.55)}
.ln .who{min-width:0;display:flex;flex-direction:column;gap:3px}
.ln .who b{font:400 20px/1 Anton,sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .who small{font:600 11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .rd{position:relative;height:24px;border-radius:6px;background:rgba(10,6,18,.6);border:1px solid rgba(255,255,255,.06)}
.ln .trail{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;width:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tc) 75%,transparent));border-radius:3px;transition:width 1.8s var(--ease)}
.ln .car{position:absolute;top:50%;left:0;width:40px;height:19px;margin:-9.5px 0 0 -40px;transition:left 1.8s var(--ease)}
.ln .car svg{width:40px;height:19px;display:block;filter:drop-shadow(0 0 6px var(--tc))}
.ln .pc{text-align:right;white-space:nowrap}
.ln .pc b{font:400 26px/1 Anton,sans-serif;font-weight:400;color:#fff}
.ln .pc b i{font-style:normal}
.ln .pc b small{font-size:15px;color:var(--tc);margin-left:1px}
.ln .pc span{display:block;font:700 11px "JetBrains Mono",monospace;color:var(--muted);margin-top:3px}
.ln.lead .pc span{color:var(--gold)}
.ln .st{min-width:0}
.ln .st b{display:block;font:400 15px/1.05 Anton,sans-serif;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .st span{display:block;font:600 11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.today{--pc:var(--c);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr 1fr;gap:2px 14px;padding:10px 22px 10px;min-height:0}
.today .lbl{grid-column:1/-1;font-size:18px;margin-bottom:2px}
.tst .v{font:400 32px/1.05 Anton,sans-serif;letter-spacing:.02em;color:#fff}
.tst .v.money{color:var(--money);text-shadow:0 2px 0 #0c2a0c}
.tst .v small{font:600 14px "JetBrains Mono",monospace;color:var(--muted);margin-left:4px}
.tst .k{font:700 11px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap}

/* ---------- bottom: spotlight + phone ---------- */
.bottom{display:grid;grid-template-columns:1.32fr 1fr;gap:16px;min-height:0}
.spot{--pc:var(--a);padding:18px 24px 18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.spot-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.spot-h .obj{font:700 12px "JetBrains Mono",monospace;letter-spacing:.2em;color:#0b0614;background:var(--gold);padding:4px 9px;border-radius:5px}
.spot-h .t{font:400 24px/1 Anton,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.spot-h .t b{font-weight:400;color:var(--gold)}
.dots{margin-left:auto;display:flex;gap:7px}
.dots i{width:26px;height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.dots i.on::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:fillx var(--rot) linear forwards}
.dots i.done{background:rgba(255,210,63,.45)}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.scene{flex:1;min-height:0;position:relative}
.scene>div{position:absolute;inset:0;opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease);pointer-events:none}
.scene>div.show{opacity:1;transform:none}

/* milestones scene */
.mt{display:grid;grid-template-columns:170px repeat(var(--n,3),1fr);column-gap:22px;align-items:center}
.mt .hd{font:400 17px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);padding-bottom:6px}
.mt .nm2{font:600 17px Inter,sans-serif;height:31px;display:flex;align-items:center;border-top:1px solid var(--line)}
.mt .cl2{height:31px;display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;border-top:1px solid var(--line)}
.mt .tr{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.mt .tr i{display:block;height:100%;width:0;background:var(--tc);border-radius:9px;box-shadow:0 0 12px var(--tc);transition:width 1.4s var(--ease);transition-delay:var(--d,0s)}
.mt .v{font:600 15px "JetBrains Mono",monospace;color:var(--muted);text-align:right}
.mt .v.full{color:var(--tc)}

/* bench scene */
.bench{display:grid;grid-template-columns:440px 1fr;gap:24px;height:100%}
.shot{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 40px -10px rgba(255,178,30,.4)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .ft{position:absolute;left:10px;top:10px;font:700 12px "JetBrains Mono",monospace;letter-spacing:.1em;padding:4px 8px;border-radius:5px;background:rgba(0,0,0,.7);color:var(--gold)}
.shot .nf{position:absolute;inset:0;display:grid;place-items:center;font:700 13px "JetBrains Mono",monospace;color:var(--dim);letter-spacing:.1em}
.fcap{font:600 13px "JetBrains Mono",monospace;color:var(--muted);margin-top:8px}
.bst{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;align-content:start}
.bst .k{font:700 11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.bst .v{font:400 36px/1.05 Anton,sans-serif;letter-spacing:.02em}
.bst .v small{font:600 14px "JetBrains Mono",monospace;color:var(--muted);margin-left:6px}
.bst .s{font:600 13px "JetBrains Mono",monospace;color:var(--muted)}
.okc{color:var(--open)} .badc{color:var(--closed)} .goldc{color:var(--gold)}
.rstate{display:inline-flex;align-items:center;gap:8px}
.rstate.run::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--open);animation:act 1.6s infinite}
.cache{grid-column:1/-1}
.bigbar{height:12px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bigbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),#ffe27a);border-radius:9px;transition:width 1.6s var(--ease);position:relative;overflow:hidden}
.bigbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:sweep 2.4s var(--ease) infinite}
@keyframes sweep{to{transform:translateX(100%)}}

/* activity scene */
.actv{display:grid;gap:9px}
.arow{display:grid;grid-template-columns:200px 1fr 110px;gap:18px;align-items:end}
.arow .who{font:400 20px/1 Anton,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--tc)}
.arow .who small{display:block;font:600 12px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.arow .bars{height:34px;gap:4px}
.arow .tot{font:400 28px/1 Anton,sans-serif;text-align:right}
.arow .tot small{display:block;font:600 11px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.1em}
.axis{display:grid;grid-template-columns:200px 1fr 110px;gap:18px;font:600 11px "JetBrains Mono",monospace;color:var(--dim);letter-spacing:.08em}
.axis div{display:flex;justify-content:space-between}

/* PR scene */
.prs{display:grid;gap:9px}
.pr{display:grid;grid-template-columns:26px 1fr auto;gap:14px;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);opacity:0;transform:translateX(-24px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:var(--d)}
.show .pr{opacity:1;transform:none}
.pr svg{width:24px;height:24px}
.pr .tt{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .mm{font:13px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.chip{font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,transparent);margin-right:8px}
.s-open{--sc:var(--open)} .s-merged{--sc:var(--merged)} .s-closed{--sc:var(--closed)} .s-draft{--sc:var(--draft)} .s-commit{--sc:var(--muted)} .s-note{--sc:var(--gold)} .s-test{--sc:var(--gold)}
.empty{color:var(--dim);font-size:18px}

/* phone (live feed) */
.phone{--pc:var(--b);padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:26px;border:2px solid rgba(255,255,255,.14)}
.ph-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 0;font:700 14px "JetBrains Mono",monospace;color:var(--ink)}
.ph-bar .ic{display:flex;gap:8px;align-items:center}
.ph-bar .ic i{display:inline-block;width:4px;background:var(--ink);border-radius:1px;margin-left:2px}
.ph-bar .bat{width:26px;height:12px;border:2px solid var(--ink);border-radius:3px;position:relative;padding:1px}
.ph-bar .bat::before{content:"";display:block;height:100%;width:72%;background:var(--money)}
.ph-h{display:flex;align-items:center;gap:12px;padding:10px 22px 12px;border-bottom:1px solid var(--line)}
.ph-h .app{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3ddc84,#1fa860);display:grid;place-items:center}
.ph-h .app svg{width:20px;height:20px;fill:#fff}
.ph-h .tt{font:400 22px/1 Anton,sans-serif;letter-spacing:.05em}
.ph-h .tt small{display:block;font:600 11px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.12em;margin-top:4px}
.msgs{flex:1;display:grid;align-content:start;gap:10px;padding:12px 18px;overflow:hidden;mask-image:linear-gradient(#000 82%,transparent)}
.msg{display:grid;grid-template-columns:40px 1fr;gap:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:400 17px Anton,sans-serif;color:#0b0614;background:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent)}
.bub{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px}
.bub .mh{display:flex;gap:8px;align-items:center;font:700 12px "JetBrains Mono",monospace;color:var(--muted);margin-bottom:3px}
.bub .mh b{font:400 15px Anton,sans-serif;letter-spacing:.05em;color:var(--tc);text-transform:uppercase}
.bub .mh .chip{margin:0}
.bub .tx{font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.new{animation:arrive 1.1s var(--spring) both}
@keyframes arrive{0%{opacity:0;transform:translateY(-18px) scale(.96)}100%{opacity:1;transform:none}}

/* ---------- breaking-news ticker ---------- */
.ticker{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;background:rgba(6,2,12,.86);border-top:2px solid var(--red);overflow:hidden;white-space:nowrap;z-index:3}
.ticker .tl{flex:none;height:100%;display:flex;align-items:center;gap:10px;padding:0 22px;font:400 24px/1 Anton,sans-serif;letter-spacing:.06em;color:#fff;background:var(--red);position:relative;z-index:1}
.ticker .tl::after{content:"";position:absolute;right:-22px;top:0;border-style:solid;border-width:56px 22px 0 0;border-color:var(--red) transparent transparent transparent}
.ticker .tl2{flex:none;height:100%;display:flex;align-items:center;padding:0 22px 0 38px;font:700 14px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--gold);background:#07030d;position:relative;z-index:1;box-shadow:16px 0 18px -6px #07030d}
.ticker .trk{display:inline-flex;gap:56px;padding-left:40px;animation:marquee var(--dur,80s) linear infinite}
.ticker .it{font-size:19px;color:var(--muted);display:inline-flex;gap:12px;align-items:center}
.ticker .it svg{width:20px;height:20px}
.ticker .it .tn{font:400 19px Anton,sans-serif;letter-spacing:.05em;color:var(--tc);text-transform:uppercase}
.ticker .it b{color:var(--ink);font-weight:500}
@keyframes marquee{to{transform:translateX(-50%)}}

.ptoast{position:absolute;left:40px;bottom:84px;width:600px;z-index:30;pointer-events:none;border-radius:22px;padding:14px 18px 18px;background:rgba(14,8,24,.96);border:2px solid rgba(255,255,255,.16);

.ptoast .pt-h span:last-child{margin-left:auto}
.ptoast .pt-b{display:grid;grid-template-columns:48px 1fr;gap:14px;margin-top:10px;align-items:center}

.ptoast .pk{font:400 19px Anton,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--tc)}

.ptoast.show .bar i{animation:fillx var(--adur) linear forwards}

.mission{position:absolute;left:0;right:0;top:390px;height:240px;z-index:32;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(5,2,10,.88) 22%,rgba(5,2,10,.88) 78%,transparent);opacity:0;transition:opacity .45s}

.mission .mi-k{font:700 18px "JetBrains Mono",monospace;letter-spacing:.3em;color:var(--tc);text-transform:uppercase}
.mission .mi-t{font:400 122px/1 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--gold);margin-top:6px;
  text-shadow:0 5px 0 #3a1d00,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,0 0 50px rgba(255,190,40,.5);transform:scale(1.5);opacity:0;transition:transform .7s var(--spring),opacity .35s}
.mission.show .mi-t{transform:none;opacity:1}

.mission .mi-s b{color:var(--money)}

.flash.go{animation:flash 1.3s var(--ease)}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

.offline{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(7,4,12,.7);font:400 40px Anton,sans-serif;color:var(--muted);letter-spacing:.08em}

<script>
const params = new URLSearchParams(location.search);
if(params.get("static")) window.STATIC_DATA = params.get("static");   // preview a data snapshot
const ROTATE = (+params.get("rotate") || 12) * 1000;   // seconds per spotlight scene
const ALERT_MS = (+params.get("alert") || 7) * 1000;
const SOUND = params.get("sound") === "1";
document.documentElement.style.setProperty("--rot", ROTATE+"ms");
document.documentElement.style.setProperty("--adur", ALERT_MS+"ms");

/* ---- fit 1920x1080 stage to any window ---- */
const stage = document.getElementById("stage");
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener("resize", fit); fit();

/* ---- palms (drawn here, original silhouettes) ---- */
const PALM = `<svg viewBox="0 0 320 620" preserveAspectRatio="xMidYMax meet"><path d="M150 620C158 470 182 340 172 196l13 1c12 145-12 276-17 423Z"/>
  <path d="M178 190C135 150 72 146 14 208c55-36 112-40 162-6Z"/><path d="M178 186C148 128 100 104 44 116c52 6 98 30 128 78Z"/>
  <path d="M180 190c42-38 102-40 136 20-38-34-88-34-130-10Z"/><path d="M180 186c26-56 72-80 128-72-50 8-90 34-118 80Z"/>
  <path d="M176 188c-8-48 4-96 32-132-12 42-18 86-22 134Z"/><path d="M176 196c-34 10-70 48-86 108 26-50 56-82 90-98Z"/>
  <path d="M182 196c32 14 62 52 72 108-22-48-48-78-80-92Z"/><circle cx="176" cy="200" r="9"/><circle cx="186" cy="206" r="7"/></svg>`;
document.getElementById("palms").innerHTML = ["p1","p2","p3","p4"].map(c=>PALM.replace("<svg", `<svg class="${c}"`)).join("");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = iso => { if(!iso) return "—"; const d=(Date.now()-new Date(iso))/1000;
  return d<45?"just now":d<3600?Math.floor(d/60)+"m ago":d<86400?Math.floor(d/3600)+"h ago":Math.floor(d/86400)+"d ago"; };
const fmt = n => (n ?? 0).toLocaleString();
const P = {
  open:"M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354Z",
  merged:"M5.45 5.154A4.25 4.25 0 0 0 9.25 7.5h1.378a2.251 2.251 0 1 1 0 1.5H9.25A5.734 5.734 0 0 1 5 7.123v3.505a2.25 2.25 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.95-.218Z",
  closed:"M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1Zm9.5 5.5a.75.75 0 0 1 .75.75v3.378a2.251 2.251 0 1 1-1.5 0V7.25a.75.75 0 0 1 .75-.75Zm-2.03-5.273a.75.75 0 0 1 1.06 0l.97.97.97-.97a.748.748 0 0 1 1.265.332.75.75 0 0 1-.205.729l-.97.97.97.97a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-.97-.97-.97.97a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l.97-.97-.97-.97a.75.75 0 0 1 0-1.06Z",
  draft:"M3.25 1A2.25 2.25 0 0 1 4 5.372v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.251 2.251 0 0 1 3.25 1Zm9.5 14a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5ZM14 7.5a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Zm0-4.25a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Z",
  commit:"M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5Zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z",
  note:"M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0Zm.75 4.75a.75.75 0 0 0-1.5 0v3.5c0 .2.08.39.22.53l2 2a.75.75 0 1 0 1.06-1.06L8.75 7.94Z",
};
const COL = {open:"var(--open)",merged:"var(--merged)",closed:"var(--closed)",draft:"var(--draft)",commit:"var(--muted)",note:"var(--gold)",test:"var(--gold)"};
const icon = k => `<svg viewBox="0 0 16 16" fill="${COL[k]||"var(--tc)"}"><path d="${P[k]||P.note}"/></svg>`;
const prState = p => p.draft && p.state==="open" ? "draft" : p.state;
const CAR = `<svg viewBox="0 0 56 26"><rect x="4" y="0" width="11" height="5" rx="2" fill="#0a0a0a"/><rect x="38" y="0" width="11" height="5" rx="2" fill="#0a0a0a"/>
  <rect x="4" y="21" width="11" height="5" rx="2" fill="#0a0a0a"/><rect x="38" y="21" width="11" height="5" rx="2" fill="#0a0a0a"/>
  <rect x="1" y="3" width="54" height="20" rx="9" fill="var(--tc)"/><rect x="31" y="6" width="11" height="14" rx="3" fill="#0b0614" opacity=".78"/>
  <rect x="10" y="6.5" width="9" height="13" rx="3" fill="#0b0614" opacity=".55"/><rect x="19" y="8" width="12" height="10" rx="2" fill="#fff" opacity=".18"/>
  <rect x="51" y="5" width="4" height="4" rx="1.5" fill="#fffbe0"/><rect x="51" y="17" width="4" height="4" rx="1.5" fill="#fffbe0"/>
  <rect x="0" y="5" width="3" height="4" rx="1" fill="#ff2d55"/><rect x="0" y="17" width="3" height="4" rx="1" fill="#ff2d55"/></svg>`;

let state = null, first = true, builtSig = null;
const team = id => state.teams.find(t=>t.id===id) || {name:id,color:"a"};
const total = id => { const w = state.milestones.reduce((s,m)=>s+m.weight,0);
  return state.milestones.reduce((s,m)=>s+(m.values[id]||0)*m.weight,0)/w; };
const feed = id => state.feeds?.[id];
const stageOf = id => { const ms=state.milestones; for(let i=ms.length-1;i>=0;i--){const v=ms[i].values[id]||0;if(v>0&&v<100)return ms[i];} return ms.find(m=>(m.values[id]||0)<100); };
const short = n => n.replace(/^team\s+/i,"");
const initials = n => short(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const ranked = () => [...state.teams].sort((x,y)=>total(y.id)-total(x.id));

function stats(id){
  const f = feed(id)||{}, ev = state.events.filter(e=>e.team===id), now = Date.now(), day = new Date().toDateString();
  const times = [...(f.commits||[]).map(c=>c.t), ...(f.pulls||[]).map(p=>p.t), ...ev.map(e=>e.t)].map(t=>+new Date(t)).filter(Boolean);
  let bars = f.activity24;   // server-side: covers the whole day even when only the newest commits are sent
  if(!bars){ bars = new Array(24).fill(0); for(const c of f.commits||[]){ const h = Math.floor((now-new Date(c.t))/3600e3); if(h>=0&&h<24) bars[23-h]++; } }
  return { f, last: times.length ? Math.max(...times) : null, bars, sum: bars.reduce((a,b)=>a+b,0),
           notesToday: ev.filter(e=>new Date(e.t).toDateString()===day).length };

function tween(el, to, dec=0, suffix=""){
  const from = parseFloat(el.dataset.v ?? 0) || 0; el.dataset.v = to;
  const t0 = performance.now(), dur = 1600, fin = ()=> el.innerHTML = (+to).toFixed(dec)+suffix;
  if(from===+to){ fin(); return; }
  const step = now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,4);
    el.innerHTML = (from+(to-from)*e).toFixed(dec)+suffix; if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step); setTimeout(fin, dur+150);
}

  $("tAv").textContent = initials(t.name);
  $("tK").innerHTML = `${esc(short(t.name))}<small>${esc(a.label)}</small>`; $("tT").textContent = a.title + (a.meta ? ` · ${a.meta}` : "");
  const bar = el.querySelector(".bar i"); bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
  el.classList.add("show"); chime(a.kind==="merged" ? [659,880,1175] : [880,1320]);
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(nextAlert, 700); }, ALERT_MS);
}
let actx;
function chime(notes){
  if(!SOUND) return;
  try{ actx ||= new AudioContext();
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+i*.11;
      o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.17,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+.6);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+.65); });
  }catch{}
}
const prSeen = new Map(), noteSeen = new Set(), readyFeeds = new Set();
function detectAlerts(){
  for(const t of state.teams){ const f = feed(t.id); if(!f) continue;
    const ready = readyFeeds.has(t.id);
    for(const p of f.pulls){ const k = t.id+"#"+p.n, st = prState(p), prev = prSeen.get(k);
      if(ready && !first && prev !== st){
        if(prev===undefined && st!=="merged" && st!=="closed") queueAlert({type:"toast", kind:st, team:t.id, label:"New pull request", title:p.title, meta:`#${p.n}`});
        else if(st==="merged") queueAlert({type:"toast", kind:"merged", team:t.id, label:"Merged ✓", title:p.title, meta:`#${p.n}`});
        else if(st==="closed" && prev) queueAlert({type:"toast", kind:"closed", team:t.id, label:"PR closed", title:p.title, meta:`#${p.n}`});
      }
      prSeen.set(k, st);
    }
    readyFeeds.add(t.id);
  }
  for(const e of state.events){ const k = e.t+e.text;
    if(!first && !noteSeen.has(k)) queueAlert({type:"toast", kind:"note", team:e.team, label:"Dev update", title:e.text});
    noteSeen.add(k);
  }
  const B = state.live?.bench, img = B?.shot?.t || (B?.frame?.kind==="image" ? B.frame.t : null);
  if(!first && img && !lastImg) queueAlert({type:"banner", team:"leonida", kicker:`${short(team("leonida").name)} · first visible frame`, title:"Mission passed", sub:"The game's first menu is on screen!"});
  if(img) lastImg = img;
}
let lastImg = null;

/* ---- main ---- */
function render(){
  if(!state) return;
  const sig = state.teams.map(t=>t.id+":"+t.color).join()+"|"+state.milestones.map(m=>m.name).join();
  if(sig !== builtSig){ if(builtSig){ first = true; for(const k in lastPct) delete lastPct[k]; lastLeader = null; } builtSig = sig; build(); }
  $("sub").textContent = `${state.teams.length} crews · ${state.scale ? "scored on PortWatch VI's public scale" : "racing to run it natively on PC"}`;
  renderCrews(); renderFeed(); renderTicker(); detectAlerts();
  if(first) showScene(0); else refreshScene();
  window.Engage?.update(state);
  first = false;
}
function setLive(on){ $("onair").classList.toggle("off", !on); $("onairTxt").textContent = on ? "LIVE" : "OFFLINE"; document.body.classList.toggle("nolive", !on && !state); }
// Static mode (GitHub Pages): no server; poll a published data.json snapshot instead.
function staticPoll(apply){
  const load = async()=>{
    try{
      const r = await fetch(window.STATIC_DATA+"?t="+Date.now(), {cache:"no-store"});
      const d = await r.json();
      apply(d, Date.now()-new Date(d.serverTime||d.updated) < 20*60e3);
    }catch{ setLive(false); }
  };
  load(); setInterval(load, 60000);
}
function connect(){
  if(window.STATIC_DATA) return staticPoll((d,fresh)=>{ state=d; setLive(fresh); render(); });
  const es = new EventSource("/api/stream");
  es.onopen = () => setLive(true);
  es.onmessage = e => { state = JSON.parse(e.data); setLive(true); render(); };
  es.addEventListener("alert", e => { const a = JSON.parse(e.data); queueAlert({type:"toast", kind:a.kind, team:a.team, label:"Test", title:a.title, meta:a.meta}); });
  es.addEventListener("engage", e => window.Engage?.event(JSON.parse(e.data)));
  es.onerror = () => setLive(false);
}
const tick = ()=>{ const s = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); $("clock").textContent = s; $("phClock").textContent = s; };
setInterval(tick, 1000); tick();
setInterval(()=>{ if(state){ renderFeed(); renderCrews(); } }, 60000);
connect();
</script>
